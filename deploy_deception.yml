---
- name: Execute Dynamic Deception Phase 1
  hosts: localhost
  connection: local
  tasks:
    - name: Step 1 - Provision Honeypot via Terraform
      ansible.builtin.command:
        cmd: terraform apply -auto-approve
        chdir: /home/aira/kltn/edge-provisioning
      register: tf_result

    - name: Step 2 - Get newly created Honeypot IP
      ansible.builtin.command:
        cmd: !unsafe "docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' honeypot-cowrie"
      register: honeypot_ip_output

    - name: Set Honeypot IP variable
      ansible.builtin.set_fact:
        honeypot_ip: "{{ honeypot_ip_output.stdout }}"

    - name: Step 3 - Execute Python OVS Redirect Script dynamically
      ansible.builtin.command:
        cmd: "python3 /home/aira/kltn/edge-provisioning/ovs_redirect.py --attacker {{ attacker_ip }} --honeypot {{ honeypot_ip }} --port 2222"
      register: python_result

    - name: Debug Output
      ansible.builtin.debug:
        msg: "Deception deployed! Traffic from {{ attacker_ip }} redirected to {{ honeypot_ip }}."
