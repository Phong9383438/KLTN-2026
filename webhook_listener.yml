---
- name: Listen for Security Alerts
  hosts: all
  sources:
    - ansible.eda.webhook:
        host: 0.0.0.0
        port: 5001
  rules:
    - name: Trigger Deception Flow on Attack
      condition: event.payload.rule.level >= 7
      action:
        run_playbook:
          name: /home/aira/kltn/edge-provisioning/deploy_deception.yml
          extra_vars:
            attacker_ip: "{{ event.payload.srcip }}"
