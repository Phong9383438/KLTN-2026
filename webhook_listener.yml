---
- name: Listen for Security Alerts
  hosts: all
  sources:
    - ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000
  rules:
    - name: Trigger Deception Flow on Attack
      condition: event.payload.alert_type == "malicious_activity"
      action:
        run_playbook:
          name: deploy_deception.yml
          extra_vars:
            attacker_ip: "{{ event.payload.attacker_ip }}"
